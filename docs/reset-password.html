<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password - Etaros</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="logo.png" />
  <style>
    /* Same tokens as the app and the landing page. */
    :root{--bg:#0A0D11;--card:#151B23;--text:#E9EFF6;--muted:#97A5B4;--dim:#616F7E;
          --accent:#4CC2FF;--border:#212A35;--border2:#2E3946;--green:#3DD68C;--red:#FF6259}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:36px 32px;width:100%;max-width:380px;text-align:center}
    .logo{width:52px;height:52px;margin:0 auto 20px;border-radius:14px;display:block;object-fit:cover}
    h1{font-size:20px;font-weight:700;color:var(--text);margin-bottom:8px;letter-spacing:-.01em}
    p{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:24px}
    input{width:100%;padding:12px 14px;background:rgba(255,255,255,.04);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none;margin-bottom:12px;transition:border-color .14s}
    input::placeholder{color:var(--dim)}
    input:focus{border-color:var(--accent)}
    button{width:100%;padding:13px;background:var(--accent);border:none;border-radius:10px;color:#08131B;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .14s}
    button:hover{opacity:.88}
    button:disabled{opacity:.5;cursor:not-allowed}
    .msg{font-size:13px;margin-top:14px;min-height:20px;line-height:1.5}
    .msg.ok{color:var(--green)}
    .msg.err{color:var(--red)}
    .open-app{display:none;margin-top:16px;padding:12px;background:rgba(76,194,255,.07);border:1px solid var(--border2);border-radius:10px;font-size:13px;color:var(--muted)}
    .open-app a{color:var(--accent);text-decoration:none;font-weight:600}
  </style>
</head>
<body>
<div class="card">
  <img class="logo" src="logo.png" alt="" width="52" height="52"/>
  <h1 id="title">Set new password</h1>
  <p id="subtitle">Enter your new password below. You'll be redirected to the app automatically.</p>

  <div id="form-area">
    <input type="password" id="pw" placeholder="New password (min 6 chars)" autocomplete="new-password"/>
    <input type="password" id="pw2" placeholder="Confirm new password" autocomplete="new-password"/>
    <button id="btn">Update password</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="open-app" id="open-app-hint">
    Password updated! <a href="sidekick://" id="app-link">Open Etaros</a> or close this tab.
  </div>
</div>

<script>
// Supabase project URL — injected at deploy via the docs site (public, same as app.config)
const SUPABASE_URL = 'https://wgiunwhzrzjjhtdijofq.supabase.co';

function getHashParam(key) {
  const h = window.location.hash.replace('#', '');
  const p = new URLSearchParams(h);
  return p.get(key);
}

const accessToken  = getHashParam('access_token');
const refreshToken = getHashParam('refresh_token');
const type         = getHashParam('type');

// Not a recovery link
if (type !== 'recovery' || !accessToken) {
  document.getElementById('title').textContent    = 'Invalid link';
  document.getElementById('subtitle').textContent = 'This password reset link has expired or is invalid. Request a new one from the Etaros app.';
  document.getElementById('form-area').style.display = 'none';
}

document.getElementById('btn').addEventListener('click', async () => {
  const pw   = document.getElementById('pw').value;
  const pw2  = document.getElementById('pw2').value;
  const msg  = document.getElementById('msg');
  const btn  = document.getElementById('btn');

  msg.className = 'msg'; msg.textContent = '';

  if (pw.length < 6) { msg.className='msg err'; msg.textContent='Password must be at least 6 characters.'; return; }
  if (pw !== pw2)    { msg.className='msg err'; msg.textContent='Passwords do not match.'; return; }

  btn.disabled = true; btn.textContent = 'Updating…';

  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      method: 'PUT',
      headers: {
        'Content-Type':  'application/json',
        'apikey':        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndnaXVud2h6cnpqamh0ZGlqb2ZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNDY0NjEsImV4cCI6MjA5NTgyMjQ2MX0.PuiGPWtr9Tzle2b3_M0QAY0ESx9PWVIEhzJlDWVkcV8',
        'Authorization': `Bearer ${accessToken}`,
      },
      body: JSON.stringify({ password: pw }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.msg || data.error_description || 'Update failed');

    btn.style.display = 'none';
    document.getElementById('pw').style.display  = 'none';
    document.getElementById('pw2').style.display = 'none';
    document.getElementById('open-app-hint').style.display = 'block';
    msg.className = 'msg ok';
    msg.textContent = '✓ Password updated successfully.';

    // Deep-link back into the app. The scheme is still "sidekick" because it is the
    // registered protocol in every shipped build; renaming it needs a coordinated release.
    setTimeout(() => { window.location.href = 'sidekick://reset-done'; }, 800);
  } catch(e) {
    msg.className = 'msg err';
    msg.textContent = e.message;
    btn.disabled = false;
    btn.textContent = 'Update password';
  }
});
</script>
</body>
</html>
