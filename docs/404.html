<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Page not found - Etaros</title>
<meta name="robots" content="noindex"/>
<link rel="icon" type="image/png" href="/etaros/logo.png"/>
<style>
  /* Same tokens as the app and the landing page. */
  :root{--bg:#0A0D11;--card:#151B23;--text:#E9EFF6;--muted:#97A5B4;--dim:#616F7E;
        --accent:#4CC2FF;--border:#212A35;
        --mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--text);min-height:100vh;display:flex;
       align-items:center;justify-content:center;padding:24px;text-align:center}
  .wrap{max-width:420px}
  img{width:56px;height:56px;border-radius:14px;margin-bottom:24px}
  .code{font-family:var(--mono);font-size:13px;color:var(--dim);letter-spacing:.08em;margin-bottom:12px}
  h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:10px}
  p{color:var(--muted);line-height:1.65;margin-bottom:28px}
  a.btn{display:inline-block;padding:13px 28px;background:var(--accent);color:#08131B;
        border-radius:11px;font-weight:700;font-size:15px;text-decoration:none;transition:opacity .14s}
  a.btn:hover{opacity:.88}
  .alt{margin-top:20px;font-size:14px;color:var(--dim)}
  .alt a{color:var(--muted);text-decoration:none}
  .alt a:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <img src="/etaros/logo.png" alt="" width="56" height="56"/>
  <div class="code">404</div>
  <h1>This page doesn't exist.</h1>
  <p>Nothing sinister — just a link that points somewhere we don't have. The rest of the site is where you left it.</p>
  <a class="btn" href="/etaros/">Back to Etaros</a>
  <div class="alt">
    or read the <a href="/etaros/privacy.html">privacy policy</a> &middot;
    <a href="https://github.com/emirilgin/etaros">source on GitHub</a>
  </div>
</div>
</body>
</html>
